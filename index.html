<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCORE</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="auth-container">

        <!-- SCHERMATA INIZIALE -->
        <section id="welcome_screen">

            <h1>SCORE</h1>

            <p>Benvenuto in SCORE</p>
            <p>Hai già un account?</p>

            <button id="show_login">
                SÌ, ACCEDI
            </button>

            <button id="show_register">
                NO, REGISTRATI
            </button>

        </section>


        <!-- SCHERMATA LOGIN -->
        <section id="login_screen" style="display: none;">

            <h1>Accedi</h1>

            <input
                type="email"
                id="login_email"
                placeholder="Email"
            >

            <input
                type="password"
                id="login_password"
                placeholder="Password"
            >

            <button onclick="loginUser()">
                ACCEDI
            </button>

            <button id="back_from_login">
                ← Indietro
            </button>

        </section>


        <!-- SCHERMATA REGISTRAZIONE -->
        <section id="register_screen" style="display: none;">

            <h1>Registrati</h1>

            <input
                type="text"
                id="register_username"
                placeholder="Username"
            >

            <input
                type="email"
                id="register_email"
                placeholder="Email"
            >

            <input
                type="password"
                id="register_password"
                placeholder="Password"
            >

            <input
                type="password"
                id="register_password_confirm"
                placeholder="Conferma password"
            >

            <button onclick="registerUser()">
                REGISTRATI
            </button>

            <button id="back_from_register">
                ← Indietro
            </button>

        </section>


        <div id="auth_message"></div>

    </main>


    <script>

        const SUPABASE_URL =
            'https://fkudvfkjjxmcbppvfinf.supabase.co';

        const SUPABASE_ANON_KEY =
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZrdWR2ZmtqanhtY2JwcHZmaW5mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3MzY3NzgsImV4cCI6MjA5NjMxMjc3OH0.iVb5dD1ySIogTJKhvpGlUkmi5PusSRMyG0EmmGAlrF8';

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY,
                {
                    auth: {
                        persistSession: false,
                        autoRefreshToken: false
                    }
                }
            );


        const welcomeScreen =
            document.getElementById('welcome_screen');

        const loginScreen =
            document.getElementById('login_screen');

        const registerScreen =
            document.getElementById('register_screen');


        document.getElementById('show_login')
            .addEventListener('click', () => {

                welcomeScreen.style.display = 'none';
                loginScreen.style.display = 'block';
                registerScreen.style.display = 'none';

            });


        document.getElementById('show_register')
            .addEventListener('click', () => {

                welcomeScreen.style.display = 'none';
                loginScreen.style.display = 'none';
                registerScreen.style.display = 'block';

            });


        document.getElementById('back_from_login')
            .addEventListener('click', () => {

                loginScreen.style.display = 'none';
                welcomeScreen.style.display = 'block';

            });


        document.getElementById('back_from_register')
            .addEventListener('click', () => {

                registerScreen.style.display = 'none';
                welcomeScreen.style.display = 'block';

            });

    </script>


    <script src="js/auth.js"></script>

</body>
</html>
