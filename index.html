<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCORE</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" sizes="512x512" href="/Score/assets/icon-512.png">

<link rel="apple-touch-icon" sizes="192x192" href="/Score/assets/icon-192.png">

<link rel="manifest" href="/Score/manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fanta 5">
<style>
.home-menu-button.image-menu-button {
    padding: 0;
    background: transparent;
    border: none;
    box-shadow: none;

    width: 85%;
    display: flex;
    justify-content: center;
    align-items: center;

    margin: 0px auto;
}

    .home-menu-button.image-menu-button img {
        display: block;
        width: 100%;
        height: auto;
        cursor: pointer;
        transition: transform 0.15s ease, filter 0.15s ease;
    }

    .home-menu-button.image-menu-button img:hover {
        transform: scale(1.02);
        filter: brightness(1.08);
    }
/* ================================
   PULSANTI RUOLI DEL MERCATO
   ================================ */

.market-sections {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
}

.market-section-button.image-role-button {
    padding: 0;
    margin: 0;
    width: 100%;
    height: auto;

    background: transparent;
    border: none;
    box-shadow: none;

    cursor: pointer;
    overflow: visible;
}

.market-section-button.image-role-button img {
    display: block;
    width: 100%;
    height: auto;

    border: none;
    box-shadow: none;

    transition:
        transform 0.15s ease,
        filter 0.15s ease;
}

.market-section-button.image-role-button:hover img {
    transform: scale(1.02);
    filter: brightness(1.10);
}

.market-section-button.image-role-button:active img {
    transform: scale(0.98);
}
.market-title-image {
    width: 100%;
    display: flex;
    justify-content: center;
    margin-bottom: 10px;
}

.market-title-image img {
    display: block;
    width: 90%;
    max-width: 420px;
    height: auto;
}
</style>
</head>

<body>

    <main class="auth-container">

        <!-- SCHERMATA INIZIALE -->
        <section id="welcome_screen">

            <h1>SCORE</h1>

            <p>Benvenuto in SCORE</p>
            <p>Hai già un account?</p>

            <button id="show_login">
                SÌ, ACCEDI
            </button>

            <button id="show_register">
                NO, REGISTRATI
            </button>

        </section>


        <!-- SCHERMATA LOGIN -->
        <section id="login_screen" style="display: none;">

            <h1>Accedi</h1>

            <input
                type="email"
                id="login_email"
                placeholder="Email"
            >

            <input
                type="password"
                id="login_password"
                placeholder="Password"
            >

            <button onclick="loginUser()">
                ACCEDI
            </button>

            <button id="back_from_login">
                ← Indietro
            </button>

        </section>


<!-- SCHERMATA REGISTRAZIONE -->
<section id="register_screen" style="display: none;">

    <h1>Registrati</h1>

    <input
        type="text"
        id="register_username"
        placeholder="Nome"
    >

    <input
        type="email"
        id="register_email"
        placeholder="Email"
    >

    <input
        type="password"
        id="register_password"
        placeholder="Password"
    >

    <input
        type="password"
        id="register_password_confirm"
        placeholder="Conferma password"
    >

    <button onclick="registerUser()">
        REGISTRATI
    </button>

    <button id="back_from_register">
        ← Indietro
    </button>

</section>


        <div id="auth_message"></div>

    </main>

<main id="app" style="display: none;">

    <!-- IMMAGINE PRINCIPALE -->
<div class="score-hero">
    <img src="/Score/assets/score-home.png" alt="Fanta 5" class="logo-fanta5">

    <button id="logout_button" class="logout-button" title="Disconnetti">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h5"></path>
            <path d="M13 16l4-4-4-4"></path>
            <path d="M8 12h9"></path>
        </svg>
    </button>
</div>

<!-- UTENTE -->
<div class="score-user-info">

    <div class="welcome-row">
        <h2 id="welcome_user"></h2>
    </div>

    <div class="home-tools-box">
    </div>

</div>

<section id="admin_section" style="display:none;">
<button class="home-menu-button image-menu-button" id="open_admin">
    <img src="/Score/assets/panel-admin.png" alt="Panel Admin">
</button>
</section>



<!-- MERCATO -->
<button class="home-menu-button image-menu-button" id="open_market">
    <img src="/Score/assets/mercato.png" alt="Mercato">
</button>
<section id="market_screen" class="score-modal" style="display: none;">

    <div class="market-title-image">
    <img src="/Score/assets/mercato-giocatori.png" alt="Mercato Giocatori">
</div>
<p id="credit_balance">0 crediti</p>
    <p>Scegli un ruolo:</p>

<div class="market-sections">

    <button class="market-section-button image-role-button"
            onclick="showPlayersByRole('P')">
        <img src="/Score/assets/portieri.png" alt="Portieri">
    </button>

    <button class="market-section-button image-role-button"
            onclick="showPlayersByRole('D')">
        <img src="/Score/assets/difensori.png" alt="Difensori">
    </button>

    <button class="market-section-button image-role-button"
            onclick="showPlayersByRole('C')">
        <img src="/Score/assets/centrocampisti.png" alt="Centrocampisti">
    </button>

    <button class="market-section-button image-role-button"
            onclick="showPlayersByRole('A')">
        <img src="/Score/assets/attaccanti.png" alt="Attaccanti">
    </button>

</div>

    <div id="market_role_players"></div>

<button class="quiz-close image-close-button" id="close_market">
    <img src="/Score/assets/chiudi.png" alt="Chiudi">
</button>

</section>

<!-- I MIEI GIOCATORI -->
<button class="home-menu-button image-menu-button" id="open_players">
    <img src="/Score/assets/formazione.png" alt="La mia formazione">
</button>


<!-- QUIZ -->
<button class="home-menu-button image-menu-button" id="open_quiz">
    <img src="/Score/assets/quiz.png" alt="Quiz">
</button>

<section id="quiz_screen" class="score-modal" style="display: none;">

<div class="market-title-image">
    <img src="/Score/assets/quizoggi.png" alt="Quiz di Oggi">
</div>

    <p id="question">Caricamento...</p>

    <div class="quiz-options">

        <label class="quiz-option">
            <input type="radio" name="quiz_answer" id="option_a" value="A">
            <span class="radio-circle"></span>
            <span class="option-text" id="option_a_text"></span>
        </label>

        <label class="quiz-option">
            <input type="radio" name="quiz_answer" id="option_b" value="B">
            <span class="radio-circle"></span>
            <span class="option-text" id="option_b_text"></span>
        </label>

        <label class="quiz-option">
            <input type="radio" name="quiz_answer" id="option_c" value="C">
            <span class="radio-circle"></span>
            <span class="option-text" id="option_c_text"></span>
        </label>

        <label class="quiz-option">
            <input type="radio" name="quiz_answer" id="option_d" value="D">
            <span class="radio-circle"></span>
            <span class="option-text" id="option_d_text"></span>
        </label>

    </div>

<button id="confirm_quiz" class="quiz-confirm">
    <img src="/Score/assets/conferma-risposta.png" alt="Conferma Risposta">
</button>

    <p class="quiz-timer">
        <span id="timer">120</span>
    </p>
<button class="quiz-close image-close-button" id="close_quiz">
    <img src="/Score/assets/chiudi.png" alt="Chiudi">
</button>
</section>


<!-- CLASSIFICA -->
<button class="home-menu-button image-menu-button" id="open_ranking">
    <img src="/Score/assets/classifiche.png" alt="Classifiche">
</button>

<!-- TESTA A TESTA -->
<button class="home-menu-button image-menu-button" id="open_h2h">
    <img src="/Score/assets/testa-a-testa.png" alt="Testa a testa">
</button>
<!-- POPUP TESTA A TESTA -->
<section id="h2h_screen" class="score-modal" style="display: none;">

<div class="market-title-image">
    <img src="/Score/assets/tvst.png" alt="Testa a Testa">
</div>



    <p id="next_h2h_match"></p>

<button class="quiz-close image-close-button" id="close_h2h">
    <img src="/Score/assets/chiudi.png" alt="Chiudi">
</button>

</section>

<!-- POPUP I MIEI GIOCATORI -->
<section id="my_players_screen" class="score-modal" style="display: none;">

<div class="market-title-image">
    <img src="/Score/assets/formazionesettimana.png" alt="La mia Formazione">
</div>

    <p id="my_players_matchday"></p>

<div id="my_players_list">

    <div class="formation-field">

        <div class="formation-row formation-attackers" id="formation_attackers"></div>

        <div class="formation-row formation-midfielders" id="formation_midfielders"></div>

        <div class="formation-row formation-defenders" id="formation_defenders"></div>

        <div class="formation-row formation-goalkeeper" id="formation_goalkeeper"></div>

    </div>

    <div class="my-players-reserves">

<h3 class="reserves-title-image">
    <img src="/Score/assets/riserve.png" alt="Riserve">
</h3>

        <div id="formation_reserves"></div>

    </div>

</div>

<button class="quiz-close image-close-button" id="close_my_players">
    <img src="/Score/assets/chiudi.png" alt="Chiudi">
</button>

</section>
<!-- POPUP CLASSIFICA -->
<section id="ranking_screen" class="score-modal" style="display: none;">

<div class="market-title-image">
    <img src="/Score/assets/classifichesettimana.png" alt="Classifiche">
</div>

    <div id="ranking_list"></div>

<button class="quiz-close image-close-button" id="close_ranking">
    <img src="/Score/assets/chiudi.png" alt="Chiudi">
</button>

</section>
</main>

<!-- POPUP ACQUISTO -->
<div id="purchase_modal" class="purchase-modal" style="display: none;">

    <div class="purchase-box">

        <h2 id="purchase_title">🛒 CONFERMA ACQUISTO</h2>

        <p id="purchase_message"></p>

        <div id="purchase_buttons" class="purchase-buttons">

            <button id="purchase_cancel" class="purchase-button cancel">
                ANNULLA
            </button>

            <button id="purchase_confirm" class="purchase-button confirm">
                ACQUISTA
            </button>

        </div>

    </div>

</div>
<!-- POPUP PASSAGGIO ALLE RISERVE -->
<div id="reserve_modal" class="purchase-modal" style="display: none;">

    <div class="purchase-box">

<h2>
    <img src="/Score/assets/titolari-completati.png"
         alt="Titolari completati"
         class="purchase-completed-icon">
</h2>

        <p>
            Hai comprato i tuoi giocatori titolari.<br><br>
            Vuoi procedere all'acquisto anche delle riserve?
        </p>

<div class="purchase-buttons">

    <button
        id="reserve_no"
        class="purchase-button cancel">
        <img src="/Score/assets/no.png" alt="No">
    </button>

    <button
        id="reserve_yes"
        class="purchase-button confirm">
        <img src="/Score/assets/si.png" alt="Sì">
    </button>

</div>
</div>
</div>
<div id="admin_page" style="display:none;">

<div class="market-title-image">
    <img src="/Score/assets/admin.png" alt="Pannello Admin">
</div>

    <p id="admin_matchday"></p>

    <div id="admin_players">
        Caricamento...
    </div>

<br>

<button id="create_league_matches" disabled>
    CREA SCONTRI
</button>

<br><br>

<button id="calculate_matches" disabled>
    CALCOLA SCONTRI
</button>

<br><br>

<button id="complete_matchday" disabled>

</button>

<br><br>

<button id="assign_leagues">
    ASSEGNA UTENTI ALLE LEGHE
</button>

<br><br>

<button id="close_admin">
    ← TORNA ALLA HOME
</button>

</div>

    <script>

        supabaseClient.auth.getSession().then(async ({ data }) => {

            if (!data.session) {
                return;
            }

            const user = data.session.user;

            console.log('Sessione trovata:', user.id);


            // Recuperiamo il nome dell'utente
            const { data: profile, error } =
                await supabaseClient
                    .from('score_users')
                    .select('username, is_admin')
                    .eq('id', user.id)
                    .single();


            if (error) {
                console.error('Errore recupero profilo:', error);
                return;
            }


            const username = profile.username || 'giocatore';


            // Nascondiamo la schermata di accesso
            document.querySelector('.auth-container').style.display =
                'none';


            // Mostriamo l'app
            document.getElementById('app').style.display =
                'block';


            // Mostriamo il nome
            document.getElementById('welcome_user').textContent =
                'Bentornato ' + username + '!';
if (profile.is_admin) {
    document.getElementById('admin_section').style.display = 'block';
}
loadCredits();
loadNextH2H();

        });

    </script>
<script>
    document.getElementById('open_quiz')
        .addEventListener('click', () => {

        document.getElementById('quiz_screen').style.display = 'block';

        loadQuestion();
    });
</script>
