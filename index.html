<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCORE</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="auth-container">

        <!-- SCHERMATA INIZIALE -->
        <section id="welcome_screen">

            <h1>SCORE</h1>

            <p>Benvenuto in SCORE</p>
            <p>Hai già un account?</p>

            <button id="show_login">
                SÌ, ACCEDI
            </button>

            <button id="show_register">
                NO, REGISTRATI
            </button>

        </section>


        <!-- SCHERMATA LOGIN -->
        <section id="login_screen" style="display: none;">

            <h1>Accedi</h1>

            <input
                type="email"
                id="login_email"
                placeholder="Email"
            >

            <input
                type="password"
                id="login_password"
                placeholder="Password"
            >

            <button onclick="loginUser()">
                ACCEDI
            </button>

            <button id="back_from_login">
                ← Indietro
            </button>

        </section>


<!-- SCHERMATA REGISTRAZIONE -->
<section id="register_screen" style="display: none;">

    <h1>Registrati</h1>

    <input
        type="text"
        id="register_username"
        placeholder="Nome"
    >

    <input
        type="email"
        id="register_email"
        placeholder="Email"
    >

    <input
        type="password"
        id="register_password"
        placeholder="Password"
    >

    <input
        type="password"
        id="register_password_confirm"
        placeholder="Conferma password"
    >

    <button onclick="registerUser()">
        REGISTRATI
    </button>

    <button id="back_from_register">
        ← Indietro
    </button>

</section>


        <div id="auth_message"></div>

    </main>

<main id="app" style="display: none;">

    <!-- IMMAGINE PRINCIPALE -->
    <div class="score-hero">
        <img
            src="assets/score-home.png"
            alt="SCORE"
        >
    </div>

    <!-- UTENTE E CREDITI -->
    <div class="score-user-info">
        <h2 id="welcome_user"></h2>
        <p id="credit_balance">0 crediti</p>
    </div>

<section id="admin_section" style="display:none;">
    <button class="home-menu-button" id="open_admin">
        ⚙️ GESTIONE VOTI
    </button>
</section>



<!-- MERCATO -->
<button class="home-menu-button" id="open_market">
    🛒 MERCATO
</button>
<!-- I MIEI GIOCATORI -->
<button class="home-menu-button" id="open_players">
    ⚽ I MIEI GIOCATORI
</button>


<!-- QUIZ -->
<button class="home-menu-button" id="open_quiz">
    🧠 QUIZ
</button>

<section id="quiz_screen" class="score-modal" style="display: none;">

    <h2>QUIZ DI OGGI</h2>

    <p id="question">Caricamento...</p>

    <button class="option" id="option_a"></button>
    <button class="option" id="option_b"></button>
    <button class="option" id="option_c"></button>
    <button class="option" id="option_d"></button>

    <p>Tempo: <span id="timer">120</span></p>
<button id="close_quiz">
    ✕ CHIUDI
</button>
</section>


<!-- CLASSIFICA -->
<button class="home-menu-button" id="open_ranking">
    🏆 CLASSIFICA
</button>

<!-- TESTA A TESTA -->
<button class="home-menu-button" id="open_h2h">
    ⚔️ TESTA A TESTA
</button>



</main>
<div id="admin_page" style="display:none;">

    <h2>⚙️ GESTIONE VOTI</h2>

    <p id="admin_matchday"></p>

    <div id="admin_players">
        Caricamento...
    </div>

<br>

<button id="calculate_matches" disabled>
    CALCOLA SCONTRI
</button>

<br><br>

<button id="complete_matchday" disabled>
    CONCLUDI GIORNATA
</button>

<br><br>

<button id="close_admin">
    ← TORNA ALLA HOME
</button>

</div>

    <script>

        supabaseClient.auth.getSession().then(async ({ data }) => {

            if (!data.session) {
                return;
            }

            const user = data.session.user;

            console.log('Sessione trovata:', user.id);


            // Recuperiamo il nome dell'utente
            const { data: profile, error } =
                await supabaseClient
                    .from('score_users')
                    .select('username, is_admin')
                    .eq('id', user.id)
                    .single();


            if (error) {
                console.error('Errore recupero profilo:', error);
                return;
            }


            const username = profile.username || 'giocatore';


            // Nascondiamo la schermata di accesso
            document.querySelector('.auth-container').style.display =
                'none';


            // Mostriamo l'app
            document.getElementById('app').style.display =
                'block';


            // Mostriamo il nome
            document.getElementById('welcome_user').textContent =
                'Bentornato ' + username + '!';
if (profile.is_admin) {
    document.getElementById('admin_section').style.display = 'block';
}
loadCredits();
loadNextH2H();
document.getElementById('open_quiz')
    .addEventListener('click', () => {

    document.getElementById('quiz_screen').style.display = 'block';

    loadQuestion();
});

        });

    </script>
